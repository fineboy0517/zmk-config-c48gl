CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
CONFIG_ZMK_KSCAN_CHARLIEPLEX_WAIT_BEFORE_INPUTS=5
# The PCB lacks a dedicated interrupt circuit for Charlieplex scanning.
# Keep polling available; deep sleep would have no verified key wakeup path.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=30000
# SuperMini-specific external power wiring is not verified.
CONFIG_ZMK_EXT_POWER=n
